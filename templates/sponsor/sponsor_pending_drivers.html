{% extends "base.html" %}

{% block head %}
<title>Sponsor - Pending Drivers</title>
{% endblock %}

{% block body %}
<div class="center-body-div">
<h1>My Pending Drivers</h1>
<br><br>
{% for driver in drivers %}
    <div class="driver-card">
        <h3>{{ driver.firstname }} {{ driver.lastname }}</h3>
        <form action="{{ url_for('sponsor.driver_accept', driver_id=driver.user_id) }}" 
            method="POST" 
            style="display: inline;"
            onsubmit="return confirm('Are you sure you want to approve {{ driver.firstname }} {{ driver.lastname }}?');">
            <button type="submit" class="btn btn-primary">
                Accept
            </button>
        </form>

        <button type="button"
            data-bs-toggle="modal" 
            data-bs-target="#rejectModal"
            data-driverid="{{ driver.user_id }}" 
            data-drivername="{{ driver.firstname }} {{ driver.lastname }}"
        >Reject</button>
    </div>
{% endfor %}
</div>
<div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="{{ url_for('sponsor.driver_reject') }}" method="POST">
        <div class="modal-header">
          <h5 class="modal-title">Reject</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="driver_id" id="targetDriverId">
          
          <p>Are you sure you want to reject <strong id="targetDriverName"></strong>?</p>
          
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea name="reason" class="form-control" rows="3" placeholder="Criminial, bad time delivery, etc." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Reject</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const rejectModal = document.getElementById('rejectModal');
  rejectModal.addEventListener('show.bs.modal', function (event) {
    const button = event.relatedTarget;
    const driverId = button.getAttribute('data-driverid');
    const driverName = button.getAttribute('data-drivername');

    document.getElementById('targetDriverId').value = driverId;
    document.getElementById('targetDriverName').textContent = driverName;
  });
</script>
{% endblock %}
