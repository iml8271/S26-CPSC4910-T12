<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointPitStop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0; /* Warm white background */
            color: #5d4037; /* Soft dark brown for text */
        }
        .navbar {
            background-color: #ff9800; /* Friendly Orange */
        }
        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }
        .hero-section {
            padding: 100px 0;
            background-color: #fff;
            border-radius: 30px;
            margin: 50px auto;
            max-width: 800px;
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.1); /* Soft orange shadow */
        }
        .display-4 {
            color: #f57c00; /* Darker Orange for title */
            font-weight: 700;
        }
        .lead {
            color: #795548;
        }
        .btn-custom {
            background-color: #ff9800;
            color: white;
            border-radius: 50px; /* Rounded buttons */
            padding: 10px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #f57c00;
            transform: scale(1.05);
        }
        .btn-outline-custom {
            color: #f57c00;
            border: 2px solid #ff9800;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-outline-custom:hover {
            background-color: #fff3e0;
            color: #f57c00;
            border-color: #f57c00;
            transform: scale(1.05);
        }
        .guest-links a {
            color: #a1887f;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
        }
        .guest-links a:hover {
            color: #f57c00;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">PointPitStop 🚗</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero-section text-center p-5">
            <h1 class="display-4">Welcome to PointPitStop!</h1>
            <p class="lead mt-3">
                The friendliest place to manage your driver rewards and sponsor partnerships. 
                Buckle up and let's make every mile count!
            </p>
            
            <div class="mt-5">
                <a class="btn btn-outline-custom btn-lg me-3"
                    href="{{ url_for('auth.handle_login') }}">Login</a>
                <a href="{{ url_for('auth.handle_driver_signup') }}" 
                    class="btn btn-custom btn-lg">Sign Up</a>
            </div>
            
            <div class="mt-5 guest-links">
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('terms') }}">Terms</a>
                <a href="{{ url_for('debugmenu') }}">Debug</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
