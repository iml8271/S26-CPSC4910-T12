{% extends "base.html" %}

{% block head %}
<title>Dashboard</title>
{% endblock %}

{% block body %}
<div class="center-body-div">
<h1>My Drivers</h1>
{% for driver in drivers %}
    <div class="driver-card">
        <h3>{{ driver.firstname }} {{ driver.lastname }}</h3>
        <p>Current Points: <strong>{{ driver.points }}</strong></p>
        <button>Adjust Points</button>
        <button>Delete</button>
    </div>
{% endfor %}
</div>
{% endblock %}
