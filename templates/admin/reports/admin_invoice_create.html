{% extends "base.html" %}
 
{% block head %}
<title>Admin - Create Invoice</title>
{% endblock %}
 
{% block body %}
 
    <h2>Create Invoice</h2>
 
    <form method="POST" action="{{ url_for('invoice.invoice_create') }}">
        <div class="mb-3">
            <label for="company_id" class="form-label">Sponsor Company</label>
            <select name="company_id" id="company_id" class="form-select" required>
                <option value="" disabled selected>Select a sponsor...</option>
                {% for company in companies %}
                <option value="{{ company.id }}">{{ company.name }}</option>
                {% endfor %}
            </select>
        </div>
 
        <div class="row mb-3">
            <div class="col">
                <label for="start_date" class="form-label">Start Date</label>
                <input type="date" name="start_date" id="start_date" class="form-control" required>
            </div>
            <div class="col">
                <label for="end_date" class="form-label">End Date</label>
                <input type="date" name="end_date" id="end_date" class="form-control" required>
            </div>
        </div>
 
        <div class="mb-3">
            <label for="notes" class="form-label">Notes (optional)</label>
            <textarea name="notes" id="notes" class="form-control" rows="3" placeholder="Any additional notes for this invoice..."></textarea>
        </div>
 
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Generate Invoice</button>
            <a href="{{ url_for('invoice.invoice_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
 
{% endblock %}
