{% extends "base.html" %}

{% block head %}
<title>View Sponsors</title>
{% endblock %}

{% block body %}
<div class="center-body-div">
<h1>All Sponsors</h1>
{% for sponsor in sponsors %}
    <div class="driver-card">
        <h3>{{ sponsor.firstname }} {{ sponsor.lastname }}</h3>
        Company: {{ sponsor.company }}
        <button>Delete</button>
    </div>
{% endfor %}
{% endblock %}
