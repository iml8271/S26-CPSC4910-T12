{% extends "base.html" %}

{% block head %}
<title>Company List</title>
{% endblock %}

{% block body %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 style="color: #5d4037; font-weight: 700;">Sponsor <span style="color: #ff9800;">Directory</span></h2>
        <p class="text-muted">All Sponsor Companies.</p>
    </div>

    <div class="row g-4">
        {% for company in companies %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 p-4" style="border-top: 4px solid #ffe0b2 !important;">
                
                <div class="text-center mb-3">
                    {% if company.logo_filename %}
                        <img src="{{ url_for('static', filename='uploads/' + company.logo_filename) }}" 
                             class="img-fluid rounded mb-2" style="max-height: 60px;">
                    {% else %}
                        <div class="display-6">🏢</div>
                    {% endif %}
                    <h5 class="mt-2" style="color: #5d4037; font-weight: 700;">{{ company.name }}</h5>
                </div>
                <div class="text-center mt-auto">
                    <a href="#" 
                       class="btn btn-link btn-sm mt-2 text-decoration-none" style="color: #795548;">
                        View All Employees
                    </a>
                </div>

                <div class="text-center mt-auto">
                    <a href="{{ url_for('view_company_profile', company_id=company.id) }}" 
                       class="btn btn-link btn-sm mt-2 text-decoration-none" style="color: #795548;">
                        View Details
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
