{% extends "base.html" %}

{% block head %}
<title>Support Form Submission</title>
{% endblock %}

{% block body %}
<h1>Support Request Form</h1>
<p>Here, you can request help from either a team member of your sponsor, or a member of our own team!</p>

<form action="{{ url_for('support.submit_req') }}" method="POST">
    <label for="request_type"> What would you like help with? </label>
    <select name="request_type" id="request_type">
        <option value="ordering">Placing an Order</option>
        <option value="balance">My Point Balance</option>
        <option value="application">My Application to a Sponsor Organization</option>
        <option value="account">My Account Information</option>
        <option value="Other">Other</option>
    </select>
    <br>

    <label for="details"> Please tell us about your problem </label>
    <textarea id="details" name="details" rows="4" cols="50"></textarea>
    <br>

    <button type="submit">Submit Request</button>
</form>
{% endblock %}
