{% extends "base.html" %}

{% block head %}

{% endblock %}

{% block body %}
<!-- Styled by AI, logic was not -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-5 shadow-lg rounded-4 border-0" style="max-width: 500px; width: 100%; border-top: 5px solid #ff9800 !important;">
        
        <h2 class="text-center mb-4" style="color: #ff9800; font-weight: 700;">Reset Password 🛠️</h2>
        
        <form id="forgot-password-form" method="POST" action="{{ url_for('auth.handle_forgot_password') }}">
            <div class="mb-3">
                <label for="username" class="form-label" style="color: #5d4037; font-weight: 600;">Username:</label>
                <input id="username" type="text" name="username" class="form-control rounded-pill" placeholder="Enter your username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label" style="color: #5d4037; font-weight: 600;">New Password:</label>
                <input id="password" type="password" name="password" class="form-control rounded-pill" placeholder="Enter new password" required>

                <label for="password" class="form-label" style="color: #5d4037; font-weight: 600;">Reenter Password:</label>
                <input id="reenter-password" type="password" name="password" class="form-control rounded-pill" placeholder="Enter new password" required>
            </div>
            
            <div class="alert alert-warning rounded-4 mb-4" style="background-color: #fff3e0; border-color: #ffe0b2; color: #795548;">
                <small>
                    <strong>Password Requirements:</strong><br>
                    • Minimum 8 characters<br>
                    • 1 uppercase & 1 lowercase letter<br>
                    • 1 digit (0-9)
                </small>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-custom btn-lg rounded-pill">Update Password</button>
            </div>
        </form>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('auth.handle_login') }}" class="text-decoration-none" style="color: #f57c00; font-weight: 600;">Back to Login</a>
        </div>
        {% if error %} <p class="error"> {{ error }}</p> {% endif %}
    </div>
</div>
{% endblock %}
